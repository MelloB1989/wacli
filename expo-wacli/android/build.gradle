plugins {
  id 'com.android.library'
  // Supplies the compile/min/target SDK versions, the Kotlin and Java toolchains, the
  // expo-modules-core dependency and the publishing setup — everything modules used to spell out by
  // hand with applyKotlinExpoModulesCorePlugin()/useCoreDependencies(). Matching the first-party
  // modules here means this module tracks the SDK's toolchain instead of pinning its own.
  id 'expo-module-gradle-plugin'
}

group = 'com.wacli.expo'
version = '0.1.0'

android {
  namespace "com.wacli.expo"

  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    consumerProguardFiles 'consumer-rules.pro'
  }

  packagingOptions {
    // The gomobile AAR and expo-modules-core can each carry a copy of this.
    pickFirst '**/libc++_shared.so'
  }
}

dependencies {
  // Built by scripts/build-bindings.sh — see the README. Absent from git deliberately: it is a
  // ~25 MB per-ABI build artifact, not source. The AAR ships prebuilt .so files and no sources, so
  // the packaged app carries a copy of the Go runtime for every ABI it keeps; narrow that with the
  // config plugin's abiFilters.
  implementation files('libs/wacli.aar')
}
