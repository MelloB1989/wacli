name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      # The tree must stay CGO-free: the Expo module binds this code for Android and iOS, and a cgo
      # dependency would put an NDK/Xcode toolchain in the path of an ordinary build. Compiling with
      # CGO_ENABLED=0 for a mobile target is the cheapest way to catch a regression at the commit
      # that introduces it.
      - name: cgo-free cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/arm64 darwin/arm64 android/arm64; do
            echo "building $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./...
          done

      # gomobile can only bind a narrow slice of Go — no maps, no slices of structs — and it is easy
      # to widen mobile/'s API past that without noticing, since it compiles perfectly well as
      # ordinary Go. gobind generates the Java and Objective-C bridges and fails if the surface is
      # unbindable, which catches the drift here rather than on someone's Mac. It needs no NDK, so
      # it costs seconds; the real AAR/XCFramework builds live in mobile-bindings.yml.
      - name: gomobile binding surface
        run: |
          go run golang.org/x/mobile/cmd/gobind@latest \
            -lang=java,objc \
            -outdir="$(mktemp -d)" \
            github.com/MelloB1989/wacli/mobile

  expo-module:
    name: expo module typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-wacli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # --ignore-scripts skips expo-module-scripts' prepare hook, which regenerates module scaffolding
      # and shells out to rsync. None of that is needed to typecheck, and it is one more thing to go
      # wrong on a runner.
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: npx tsc --noEmit

      # The example app is the module's only real consumer, so typechecking it is what catches an
      # API change that compiles fine in isolation but breaks every caller.
      - name: example app
        working-directory: expo-wacli/example
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npx tsc --noEmit

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      # Built from source with this workflow's toolchain rather than installed by
      # golangci-lint-action. The action downloads a prebuilt binary, and every golangci-lint v1
      # release is built with Go 1.24, which refuses a module targeting Go 1.25 outright:
      #
      #   can't load config: the Go language version (go1.24) used to build golangci-lint
      #   is lower than the targeted Go version (1.25.6)
      #
      # That is why this job had never once passed. Pinned rather than @latest so a new lint release
      # cannot turn CI red on its own; v2 currently reports 22 pre-existing issues in code this
      # ruleset was written against, so moving to it is a deliberate change, not a version bump.
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 run --timeout=5m
