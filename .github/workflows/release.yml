name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64, runner: ubuntu-latest }
          - { os: darwin,  arch: arm64, runner: macos-latest }
          - { os: darwin,  arch: amd64, runner: macos-13 }
          # CGO/SQLite means we build on native runners, not cross-compile.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Resolve version
        id: v
        shell: bash
        run: echo "version=${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          out="wacli-${{ matrix.os }}-${{ matrix.arch }}"
          go build -ldflags "-s -w -X main.version=${{ steps.v.outputs.version }}" -o "$out" .
          shasum -a 256 "$out" > "$out.sha256" || sha256sum "$out" > "$out.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          files: |
            wacli-${{ matrix.os }}-${{ matrix.arch }}
            wacli-${{ matrix.os }}-${{ matrix.arch }}.sha256
