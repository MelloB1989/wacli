name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64, runner: ubuntu-latest }
          - { os: darwin,  arch: arm64, runner: macos-latest }
          - { os: darwin,  arch: amd64, runner: macos-latest }
          # CGO/SQLite rules out cross-compiling between operating systems, so linux and darwin build
          # on their own runners. Crossing architectures within macOS is fine, though: Apple's clang
          # targets either with -arch, and the darwin/amd64 job used to sit on macos-13, which GitHub
          # has since retired — it queued forever and every release shipped without an Intel binary.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Resolve version
        id: v
        shell: bash
        run: echo "version=${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          out="wacli-${{ matrix.os }}-${{ matrix.arch }}"
          # Point the C toolchain at the same architecture Go is targeting, or CGO builds host-native
          # objects and the link fails.
          if [ "${{ matrix.os }}" = "darwin" ] && [ "${{ matrix.arch }}" = "amd64" ]; then
            export CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64"
          fi
          go build -ldflags "-s -w -X main.version=${{ steps.v.outputs.version }}" -o "$out" .
          file "$out" || true
          shasum -a 256 "$out" > "$out.sha256" || sha256sum "$out" > "$out.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          files: |
            wacli-${{ matrix.os }}-${{ matrix.arch }}
            wacli-${{ matrix.os }}-${{ matrix.arch }}.sha256
