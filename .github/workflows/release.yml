name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every target builds on one Linux runner. The tree is CGO-free since SQLite moved to
          # modernc.org/sqlite, so there is no C toolchain to match to the target any more and
          # `GOOS=darwin go build` from Linux just works. This previously needed a macOS runner per
          # OS, and the darwin/amd64 job in particular kept shipping releases without an Intel
          # binary whenever its runner image was retired.
          - { os: linux,   arch: amd64 }
          - { os: linux,   arch: arm64 }
          - { os: darwin,  arch: arm64 }
          - { os: darwin,  arch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Resolve version
        id: v
        shell: bash
        run: echo "version=${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          out="wacli-${{ matrix.os }}-${{ matrix.arch }}"
          go build -ldflags "-s -w -X main.version=${{ steps.v.outputs.version }}" -o "$out" .
          file "$out" || true
          shasum -a 256 "$out" > "$out.sha256" || sha256sum "$out" > "$out.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          files: |
            wacli-${{ matrix.os }}-${{ matrix.arch }}
            wacli-${{ matrix.os }}-${{ matrix.arch }}.sha256
